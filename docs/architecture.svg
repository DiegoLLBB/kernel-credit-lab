<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Public Sans, Helvetica, Arial, sans-serif" role="img" aria-label="Kernel Credit Lab architecture: filings flow through a checked agent into records, then into checked insight and the dashboard" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1C232B"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#F6F7F5"/>
  <text x="40" y="52" font-size="26" font-weight="600" fill="#1C232B">Every number comes from a filing and is checked before anyone sees it</text>
  <text x="40" y="80" font-size="15" fill="#5E6A72">Kernel Credit Lab · how a new filing becomes a checked alert · Meta models in bold</text>

  <!-- sources -->
  <g>
    <rect x="40" y="120" width="230" height="250" rx="8" fill="none" stroke="#1C232B" stroke-width="1.25"/>
    <text x="58" y="150" font-size="16" font-weight="600" fill="#1C232B">Public sources</text>
    <text x="58" y="180" font-size="14" fill="#1C232B">SEC EDGAR filings</text>
    <text x="58" y="204" font-size="14" fill="#1C232B">(8-K, 10-Q, 10-K, 424B)</text>
    <text x="58" y="232" font-size="14" fill="#1C232B">Issuer press releases</text>
    <text x="58" y="260" font-size="14" fill="#1C232B">SEC XBRL company facts</text>
    <text x="58" y="288" font-size="14" fill="#1C232B">FRED Treasury yields, FX</text>
    <text x="58" y="324" font-size="13" fill="#5E6A72">Polled 07:00 and 19:00</text>
    <text x="58" y="344" font-size="13" fill="#5E6A72">Madrid (Cloud Scheduler)</text>
  </g>

  <!-- agent -->
  <g>
    <rect x="330" y="120" width="300" height="250" rx="8" fill="#E6EF6E" fill-opacity="0.35" stroke="#1C232B" stroke-width="2"/>
    <text x="348" y="150" font-size="16" font-weight="600" fill="#1C232B">Agent per document</text>
    <text x="348" y="174" font-size="14" font-weight="700" fill="#1C232B">Muse Spark</text>
    <text x="348" y="204" font-size="13.5" fill="#1C232B">Checks inside its tools:</text>
    <text x="358" y="228" font-size="13.5" fill="#1C232B">• facts must be exact quotes</text>
    <text x="358" y="250" font-size="13.5" fill="#1C232B">• record changes must cite facts</text>
    <text x="358" y="272" font-size="13.5" fill="#1C232B">• maturity wall recomputed in code</text>
    <text x="358" y="294" font-size="13.5" fill="#1C232B">• materiality decided in code</text>
    <text x="348" y="326" font-size="13" fill="#5E6A72">Frozen at f997487 since 2 Nov;</text>
    <text x="348" y="344" font-size="13" fill="#5E6A72">every step stored as a trace</text>
  </g>

  <!-- independent check -->
  <g>
    <rect x="690" y="120" width="230" height="150" rx="8" fill="none" stroke="#1C232B" stroke-width="1.25"/>
    <text x="708" y="150" font-size="16" font-weight="600" fill="#1C232B">Independent check</text>
    <text x="708" y="174" font-size="14" font-weight="700" fill="#1C232B">Muse Spark Open</text>
    <text x="708" y="196" font-size="13" fill="#5E6A72">open weights, on Baseten</text>
    <text x="708" y="224" font-size="13.5" fill="#1C232B">Refuses any claim the</text>
    <text x="708" y="246" font-size="13.5" fill="#1C232B">quoted evidence doesn't support</text>
  </g>

  <!-- alert -->
  <g>
    <rect x="980" y="120" width="180" height="150" rx="8" fill="none" stroke="#B4472E" stroke-width="2"/>
    <text x="998" y="150" font-size="16" font-weight="600" fill="#1C232B">Alert</text>
    <text x="998" y="178" font-size="13.5" fill="#1C232B">before → after wall</text>
    <text x="998" y="200" font-size="13.5" fill="#1C232B">the quotes behind it</text>
    <text x="998" y="222" font-size="13.5" fill="#1C232B">the check's verdict</text>
    <text x="998" y="244" font-size="13.5" fill="#1C232B">the full trace</text>
  </g>

  <!-- records -->
  <g>
    <rect x="330" y="430" width="300" height="130" rx="8" fill="none" stroke="#1C232B" stroke-width="1.25"/>
    <text x="348" y="460" font-size="16" font-weight="600" fill="#1C232B">Records (PostgreSQL)</text>
    <text x="348" y="488" font-size="13.5" fill="#1C232B">bonds and loans, point in time</text>
    <text x="348" y="510" font-size="13.5" fill="#1C232B">quoted facts, applied changes</text>
    <text x="348" y="532" font-size="13.5" fill="#1C232B">XBRL credit metrics, sector peers</text>
  </g>

  <!-- insight -->
  <g>
    <rect x="690" y="430" width="230" height="140" rx="8" fill="none" stroke="#1C232B" stroke-width="1.25"/>
    <text x="708" y="460" font-size="16" font-weight="600" fill="#1C232B">Checked insight</text>
    <text x="708" y="484" font-size="14" font-weight="700" fill="#1C232B">Muse Spark, Muse Wonder</text>
    <text x="708" y="510" font-size="13.5" fill="#1C232B">snapshots and daily brief</text>
    <text x="708" y="532" font-size="13.5" fill="#1C232B">from computed numbers only,</text>
    <text x="708" y="552" font-size="13.5" fill="#1C232B">each sentence checked</text>
  </g>

  <!-- charts -->
  <g>
    <rect x="40" y="430" width="230" height="170" rx="8" fill="none" stroke="#1C232B" stroke-width="1.25"/>
    <text x="58" y="460" font-size="16" font-weight="600" fill="#1C232B">Investor-deck charts</text>
    <text x="58" y="484" font-size="14" font-weight="700" fill="#1C232B">SAM 3.1 + Muse Spark</text>
    <text x="58" y="510" font-size="13.5" fill="#1C232B">SAM finds the bars,</text>
    <text x="58" y="532" font-size="13.5" fill="#1C232B">Spark reads the values,</text>
    <text x="58" y="554" font-size="13.5" fill="#1C232B">bar heights must agree,</text>
    <text x="58" y="576" font-size="13.5" fill="#1C232B">then checked against XBRL</text>
  </g>

  <!-- dashboard -->
  <g>
    <rect x="980" y="430" width="180" height="130" rx="8" fill="#1C232B"/>
    <text x="998" y="460" font-size="16" font-weight="600" fill="#F6F7F5">Dashboard</text>
    <text x="998" y="486" font-size="13.5" fill="#F6F7F5">Next.js + FastAPI</text>
    <text x="998" y="508" font-size="13.5" fill="#F6F7F5">on Cloud Run,</text>
    <text x="998" y="530" font-size="13.5" fill="#F6F7F5">Firebase Hosting</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="#1C232B" stroke-width="1.5">
    <path d="M270 220H330" marker-end="url(#a)"/>
    <path d="M630 195H690" marker-end="url(#a)"/>
    <path d="M920 195H980" marker-end="url(#a)"/>
    <path d="M480 370V430" marker-end="url(#a)"/>
    <path d="M630 495H690" marker-end="url(#a)"/>
    <path d="M920 495H980" marker-end="url(#a)"/>
    <path d="M1070 270V430" marker-end="url(#a)"/>
    <path d="M270 515H330" marker-end="url(#a)"/>
    <path d="M155 370V430" marker-end="url(#a)"/>
  </g>
  <text x="940" y="186" font-size="12" fill="#5E6A72" text-anchor="middle">passes</text>
  <text x="490" y="406" font-size="12" fill="#5E6A72">applied changes</text>

  <text x="40" y="660" font-size="15" fill="#1C232B">Measured: replay of 29 real 2026 events (9 of 14 caught, 7 with the right year and amount, 1 false alert);</text>
  <text x="40" y="684" font-size="15" fill="#1C232B">live since 2 Nov on new filings with the agent frozen. A one-shot model on the same documents: 8 of 14, 3 right.</text>
  <text x="40" y="724" font-size="13" fill="#5E6A72">Research support only. Not investment advice.</text>
</svg>
