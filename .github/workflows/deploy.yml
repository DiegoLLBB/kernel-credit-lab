name: Deploy

# Deploys main to Google Cloud after CI passes: images to Artifact Registry, migrations as a
# Cloud Run job, API and web to Cloud Run, then Firebase Hosting (custom domain, routing).
# Auth is keyless (Workload Identity Federation); no Google key is stored in GitHub.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: kernel-credit-lab
  REGION: europe-west1
  REGISTRY: europe-west1-docker.pkg.dev/kernel-credit-lab/kernel
  SQL_INSTANCE: kernel-credit-lab:europe-west1:kernel-credit-lab-instance
  SITE_URL: https://kernel-credit-lab.web.app
  RUNTIME_SA: kcl-runtime@kernel-credit-lab.iam.gserviceaccount.com
  WEB_SA: kcl-web@kernel-credit-lab.iam.gserviceaccount.com
  # Shared by kernel-api and every Cloud Run job (seed, replay, decks, insight): same service
  # account, Cloud SQL instance, secrets and env vars, so the jobs write to Cloud SQL
  # through the same code paths that run locally. Only --set-secrets references here;
  # no secret values anywhere in code, workflow files or logs.
  JOB_SECRETS: DATABASE_URL=DATABASE_URL:latest,MODEL_API_KEY=MODEL_API_KEY:latest,SEC_USER_AGENT=SEC_USER_AGENT:latest,FRED_API_KEY=FRED_API_KEY:latest,BASETEN_API_KEY=BASETEN_API_KEY:latest
  JOB_ENV_VARS: '^@^APP_ENV=production@LOG_LEVEL=INFO@META_MODEL_API_BASE_URL=https://api.meta.ai/v1@DEFAULT_MODEL=muse-spark-1.3@DEEP_RESEARCH_MODEL=muse-wonder-1.0@VISION_SEGMENTATION_MODEL=sam-3.1@BASETEN_BASE_URL=https://inference.baseten.co/v1@OPEN_MODEL=meta-models/muse-spark-open-1026@MODEL_PRICING_JSON={"muse-spark-1.3": [1.25, 4.25], "meta-models/muse-spark-open-1026": [0, 0]}@MAX_RUN_COST_USD=2.0@QUEUE_ENABLED=false'

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: kcl-deployer@kernel-credit-lab.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push images
        run: |
          SHA=$(git rev-parse --short=12 HEAD)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          docker build --build-arg EXTRAS= -t "$REGISTRY/api:$SHA" backend
          docker build --target prod --build-arg NEXT_PUBLIC_API_URL="$SITE_URL" -t "$REGISTRY/web:$SHA" web
          docker push "$REGISTRY/api:$SHA"
          docker push "$REGISTRY/web:$SHA"

      - name: Run database migrations
        run: |
          gcloud run jobs deploy kernel-migrate --region="$REGION" --image="$REGISTRY/api:$SHA" \
            --service-account="$RUNTIME_SA" --set-cloudsql-instances="$SQL_INSTANCE" \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest --set-env-vars=APP_ENV=production \
            --command=alembic --args=upgrade,head --max-retries=0 --task-timeout=300 \
            --execute-now --wait

      - name: Deploy API
        run: |
          gcloud run deploy kernel-api --region="$REGION" --image="$REGISTRY/api:$SHA" \
            --service-account="$RUNTIME_SA" --set-cloudsql-instances="$SQL_INSTANCE" \
            --allow-unauthenticated --min-instances=0 --max-instances=2 --concurrency=20 \
            --cpu=1 --memory=512Mi --timeout=900 \
            --set-secrets="$JOB_SECRETS" \
            --set-env-vars="$JOB_ENV_VARS"

      # Data jobs: deployed on every deploy, never executed by it (only kernel-migrate
      # above keeps --execute-now). Started on demand via the Run job workflow.
      - name: Deploy seed job
        run: |
          # 1 CPU / 1 GiB: pure DB writes plus FRED HTTP, no model calls. A 30-minute
          # timeout is generous for 9 issuers and 8 FRED series. --max-retries=0 so a
          # failed execution never double-writes (load_seed/load_rates are idempotent).
          gcloud run jobs deploy kernel-seed --region="$REGION" --image="$REGISTRY/api:$SHA" \
            --service-account="$RUNTIME_SA" --set-cloudsql-instances="$SQL_INSTANCE" \
            --set-secrets="$JOB_SECRETS" --set-env-vars="$JOB_ENV_VARS" \
            --cpu=1 --memory=1Gi --task-timeout=1800 --max-retries=0 \
            --command=python --args="-m,scripts.seed_job"

      - name: Deploy replay job
        run: |
          # 1 CPU / 1 GiB: the agent loop holds filing text and transcripts in memory;
          # 1 GiB is plenty (no PDF rendering here). 6 hours fits a full 29-event replay
          # (~$15 of model calls at current prices); the runner is resumable, so a
          # re-execution continues where it stopped. Defaults run the full window then
          # --eval-latest, which writes the replay_evaluation row the API reads.
          # Arguments are supplied at execution time (Run job workflow) and override these.
          gcloud run jobs deploy kernel-replay --region="$REGION" --image="$REGISTRY/api:$SHA" \
            --service-account="$RUNTIME_SA" --set-cloudsql-instances="$SQL_INSTANCE" \
            --set-secrets="$JOB_SECRETS" --set-env-vars="$JOB_ENV_VARS" \
            --cpu=1 --memory=1Gi --task-timeout=21600 --max-retries=0 \
            --command=python --args="-m,scripts.run_replay,--max-cost-usd,30,--eval-latest"

      - name: Deploy decks job
        run: |
          # 2 CPU / 2 GiB: PDF page rendering (pypdfium2) is the hungry part; SAM/Spark
          # calls are HTTP. 2 hours fits all 5 decks (~$0.40). Commits after every page,
          # so a re-execution keeps finished pages (--reprocess to redo).
          gcloud run jobs deploy kernel-decks --region="$REGION" --image="$REGISTRY/api:$SHA" \
            --service-account="$RUNTIME_SA" --set-cloudsql-instances="$SQL_INSTANCE" \
            --set-secrets="$JOB_SECRETS" --set-env-vars="$JOB_ENV_VARS" \
            --cpu=2 --memory=2Gi --task-timeout=7200 --max-retries=0 \
            --command=python --args="-m,scripts.decks_job"

      - name: Deploy insight job
        run: |
          # 1 CPU / 1 GiB: checked credit-insight text (snapshot per issuer plus any
          # missing alert impact sentences). Each text is one Spark write plus one
          # Spark Open check per sentence; results are cached by input hash, so a
          # re-execution only pays for new inputs. 30 minutes fits all 6 issuers.
          # Arguments are supplied at execution time (Run job workflow) and override these.
          gcloud run jobs deploy kernel-insight --region="$REGION" --image="$REGISTRY/api:$SHA" \
            --service-account="$RUNTIME_SA" --set-cloudsql-instances="$SQL_INSTANCE" \
            --set-secrets="$JOB_SECRETS" --set-env-vars="$JOB_ENV_VARS" \
            --cpu=1 --memory=1Gi --task-timeout=1800 --max-retries=0 \
            --command=python --args="-m,scripts.insight_job"

      - name: Deploy web
        run: |
          gcloud run deploy kernel-web --region="$REGION" --image="$REGISTRY/web:$SHA" \
            --service-account="$WEB_SA" --allow-unauthenticated \
            --min-instances=0 --max-instances=2 --concurrency=40 --cpu=1 --memory=512Mi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy Firebase Hosting
        run: npx --yes firebase-tools@14 deploy --only hosting --project "$PROJECT_ID" --non-interactive

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "$SITE_URL/health" && curl -fsS -o /dev/null "$SITE_URL/"; then echo; echo "live: $SITE_URL ($SHA)"; exit 0; fi
            sleep 10
          done
          echo "smoke test failed"; exit 1
