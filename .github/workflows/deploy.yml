name: Deploy

# Deploys main to Google Cloud after CI passes: images to Artifact Registry, migrations as a
# Cloud Run job, API and web to Cloud Run, then Firebase Hosting (custom domain, routing).
# Auth is keyless (Workload Identity Federation); no Google key is stored in GitHub.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: kernel-credit-lab
  REGION: europe-west1
  REGISTRY: europe-west1-docker.pkg.dev/kernel-credit-lab/kernel
  SQL_INSTANCE: kernel-credit-lab:europe-west1:kernel-credit-lab-instance
  SITE_URL: https://kernel-credit-lab.web.app
  RUNTIME_SA: kcl-runtime@kernel-credit-lab.iam.gserviceaccount.com
  WEB_SA: kcl-web@kernel-credit-lab.iam.gserviceaccount.com

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: kcl-deployer@kernel-credit-lab.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push images
        run: |
          SHA=$(git rev-parse --short=12 HEAD)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          docker build --build-arg EXTRAS= -t "$REGISTRY/api:$SHA" backend
          docker build --target prod --build-arg NEXT_PUBLIC_API_URL="$SITE_URL" -t "$REGISTRY/web:$SHA" web
          docker push "$REGISTRY/api:$SHA"
          docker push "$REGISTRY/web:$SHA"

      - name: Run database migrations
        run: |
          gcloud run jobs deploy kernel-migrate --region="$REGION" --image="$REGISTRY/api:$SHA" \
            --service-account="$RUNTIME_SA" --set-cloudsql-instances="$SQL_INSTANCE" \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest --set-env-vars=APP_ENV=production \
            --command=alembic --args=upgrade,head --max-retries=0 --task-timeout=300 \
            --execute-now --wait

      - name: Deploy API
        run: |
          gcloud run deploy kernel-api --region="$REGION" --image="$REGISTRY/api:$SHA" \
            --service-account="$RUNTIME_SA" --set-cloudsql-instances="$SQL_INSTANCE" \
            --allow-unauthenticated --min-instances=0 --max-instances=2 --concurrency=20 \
            --cpu=1 --memory=512Mi --timeout=900 \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest,MODEL_API_KEY=MODEL_API_KEY:latest,SEC_USER_AGENT=SEC_USER_AGENT:latest,FRED_API_KEY=FRED_API_KEY:latest \
            --set-env-vars="^@^APP_ENV=production@LOG_LEVEL=INFO@META_MODEL_API_BASE_URL=https://api.meta.ai/v1@DEFAULT_MODEL=muse-spark-1.3@DEEP_RESEARCH_MODEL=muse-wonder-1.0@VISION_SEGMENTATION_MODEL=sam-3.1@MAX_RUN_COST_USD=2.0"

      - name: Deploy web
        run: |
          gcloud run deploy kernel-web --region="$REGION" --image="$REGISTRY/web:$SHA" \
            --service-account="$WEB_SA" --allow-unauthenticated \
            --min-instances=0 --max-instances=2 --concurrency=40 --cpu=1 --memory=512Mi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy Firebase Hosting
        run: npx --yes firebase-tools@14 deploy --only hosting --project "$PROJECT_ID" --non-interactive

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "$SITE_URL/health" && curl -fsS -o /dev/null "$SITE_URL/"; then echo; echo "live: $SITE_URL ($SHA)"; exit 0; fi
            sleep 10
          done
          echo "smoke test failed"; exit 1
