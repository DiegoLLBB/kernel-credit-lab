# Watchlist flag thresholds for credit metrics (shown in the UI legend).
#
# Direction: for leverage and net_leverage lower is stronger; for
# interest_coverage higher is stronger. Bands are screening flags, not ratings.
# A null value or missing metric is shown as missing, never flagged.
#
# Leverage bands are sector-aware: utilities and telecoms run with more debt,
# so their green/amber ceilings sit higher. Sectors without a by_sector entry
# use the default. Cash-only liquidity stays unbanded; total (cash + undrawn)
# carries risk bands.

metrics:
  leverage:
    label: "Debt ÷ EBITDA"
    unit: "x"
    green_max: 2.5 # at or below is comfortable for most investment-grade issuers
    amber_max: 4.0 # above needs a deleveraging story
    by_sector:
      Utilities:
        green_max: 4.0 # regulated utilities carry denser balance sheets
        amber_max: 5.5
      Communication Services:
        green_max: 3.5 # telecoms typically run with more leverage than tech
        amber_max: 4.5
      # Legacy alias (pre-GICS rename)
      Telecommunications:
        green_max: 3.5
        amber_max: 4.5
  net_leverage:
    label: "Net debt ÷ EBITDA"
    unit: "x"
    green_max: 2.0
    amber_max: 3.5
    by_sector:
      Utilities:
        green_max: 3.5
        amber_max: 5.0
      Communication Services:
        green_max: 3.0
        amber_max: 4.0
      Telecommunications:
        green_max: 3.0
        amber_max: 4.0
  interest_coverage:
    label: "EBITDA ÷ interest"
    unit: "x"
    green_min: 6.0 # at or above covers interest comfortably
    amber_min: 3.0 # below struggles to cover interest from earnings
  fcf_to_debt:
    label: "Free cash flow ÷ debt"
    unit: "x"
    green_min: 0.1
    amber_min: 0.0 # negative means borrowing to fund the business
  # Cash-only liquidity stays unbanded (label: "Cash only (excludes credit lines)").
  liquidity_coverage_total:
    label: "Cash + undrawn credit lines"
    unit: "x"
    green_min: 1.0 # covers the next 24 months of maturities at least once
    amber_min: 0.5 # below half coverage needs a funding story
